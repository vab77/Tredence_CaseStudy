[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tredence-submission"
version = "0.1.0"
description = "NumPy self-pruning network with reverse-mode autodiff"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "nn*", "optim*", "prune*", "train*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
